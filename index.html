<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economic Dynamics & Policy — Research Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0D1B2A;
    --slate: #1C3B5A;
    --accent: #4A7FA5;
    --gold: #C4A35A;
    --gold-light: #D4B87A;
    --ivory: #F5F0E8;
    --text-muted: #8A9BB0;
    --border: rgba(74,127,165,0.2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--navy);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* top mono label */
  .top-label {
    text-align: center;
    padding: 2rem 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--text-muted);
    text-transform: uppercase;
    flex-shrink: 0;
  }

  /* main split */
  .split {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    min-height: 0;
  }

  .divider {
    background: var(--border);
    position: relative;
  }
  .divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 1px var(--navy), 0 0 0 2px var(--gold);
  }

  .side {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 4rem;
    text-decoration: none;
    position: relative;
    transition: background 0.4s ease;
    cursor: pointer;
  }
  .side:hover { background: rgba(74,127,165,0.04); }

  .side-gl { border-right: none; }
  .side-en { border-left: none; }

  /* flag */
  .flag {
    width: 88px;
    height: 60px;
    margin-bottom: 2rem;
    display: block;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
    flex-shrink: 0;
  }
  .side:hover .flag { transform: scale(1.08); box-shadow: 0 6px 22px rgba(0,0,0,0.5), 0 2px 5px rgba(0,0,0,0.35); }

  /* group name */
  .group-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 2.5vw, 2.1rem);
    font-weight: 400;
    color: var(--ivory);
    text-align: center;
    line-height: 1.25;
    margin-bottom: 0.5rem;
  }
  .group-name em {
    font-style: italic;
    color: var(--gold-light);
  }

  .group-slug {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 2.5rem;
  }

  /* enter button */
  .enter-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1.4rem;
    border: 0.5px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
    letter-spacing: 0.08em;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    transition: border-color 0.25s, color 0.25s;
    text-decoration: none;
  }
  .side:hover .enter-btn {
    border-color: var(--gold);
    color: var(--gold);
  }

  /* bottom bar */
  .bottom-bar {
    flex-shrink: 0;
    border-top: 0.5px solid var(--border);
    padding: 1rem 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .lang-pill {
    display: inline-block;
    padding: 2px 8px;
    border: 0.5px solid var(--border);
    font-size: 9px;
    letter-spacing: 0.1em;
  }

  @media (max-width: 640px) {
    .split { grid-template-columns: 1fr; grid-template-rows: 1fr 1px 1fr; }
    .divider { height: 1px; width: 100%; }
    .divider::before { top: 0; left: 50%; }
    .side { padding: 3rem 2rem; }
    body { overflow: auto; }
  }
</style>
</head>
<body>

<p class="top-label">economicdynamics&amp;policy_researchgroup · USC</p>

<div class="split">

  <!-- GALICIAN SIDE -->
  <a class="side side-gl" href="gl.html">
    <svg class="flag" viewBox="0 0 88 60" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="flag-clip-gl">
          <rect width="88" height="60" rx="6"/>
        </clipPath>
      </defs>
      <g clip-path="url(#flag-clip-gl)">
        <rect width="88" height="60" fill="#f0f0f0"/>
        <!-- diagonal stripe: top-left to bottom-right, ~1/4 width -->
        <polygon points="0,0 26,0 88,60 62,60" fill="#2B9ED4"/>
        <!-- subtle inner border -->
        <rect width="88" height="60" rx="6" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
      </g>
    </svg>
    <h1 class="group-name">Economía <em>Dinámica</em><br>e Políticas</h1>
    <p class="group-slug">Grupo de Investigación</p>
    <span class="enter-btn">Entrar &rarr;</span>
  </a>

  <div class="divider"></div>

  <!-- ENGLISH SIDE -->
  <a class="side side-en" href="en.html">
    <svg class="flag" viewBox="0 0 88 60" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="flag-clip-uk">
          <rect width="88" height="60" rx="6"/>
        </clipPath>
      </defs>
      <g clip-path="url(#flag-clip-uk)">
        <!-- Blue background -->
        <rect width="88" height="60" fill="#012169"/>
        <!-- White diagonals (St Andrew + St Patrick base) -->
        <line x1="0" y1="0" x2="88" y2="60" stroke="white" stroke-width="12"/>
        <line x1="88" y1="0" x2="0" y2="60" stroke="white" stroke-width="12"/>
        <!-- Red diagonals (St Patrick) -->
        <line x1="0" y1="0" x2="88" y2="60" stroke="#C8102E" stroke-width="6"/>
        <line x1="88" y1="0" x2="0" y2="60" stroke="#C8102E" stroke-width="4"/>
        <!-- White cross (St George) -->
        <rect x="0" y="22" width="88" height="16" fill="white"/>
        <rect x="36" y="0" width="16" height="60" fill="white"/>
        <!-- Red cross (St George) -->
        <rect x="0" y="25" width="88" height="10" fill="#C8102E"/>
        <rect x="39" y="0" width="10" height="60" fill="#C8102E"/>
        <!-- subtle inner border -->
        <rect width="88" height="60" rx="6" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
      </g>
    </svg>
    <h1 class="group-name">Economic <em>Dynamics</em><br>&amp; Policy</h1>
    <p class="group-slug">Research Group</p>
    <span class="enter-btn">Enter &rarr;</span>
  </a>

</div>

<div class="bottom-bar">
  <span class="lang-pill">GL</span>
  <span>·</span>
  University of Santiago de Compostela
  <span>·</span>
  <span class="lang-pill">EN</span>
</div>

</body>
</html>
